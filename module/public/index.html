<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Exigency Management System</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Exigency Management System</h1>
    <nav>
      <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="exigencies">Exigencies</button>
      <button class="tab-btn" data-tab="schools">Schools</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
      <button class="tab-btn" data-tab="logs">Logs</button>
    </nav>
  </header>

  <main>
    <section id="tab-dashboard" class="tab-panel active">
      <div class="kpi-grid" id="kpiGrid"></div>
      <h2>School-wise Counts</h2>
      <table class="data-table" id="schoolCountsTable">
        <thead><tr><th>School</th><th>Total</th><th>Open</th><th>Closed</th></tr></thead>
        <tbody></tbody>
      </table>
      <button id="runReminderBtn" class="btn-primary">Run Daily Reminder Job Now</button>
      <span id="reminderResult"></span>
    </section>

    <section id="tab-exigencies" class="tab-panel">
      <div class="toolbar">
        <select id="filterSchool"><option value="">All Schools</option></select>
        <select id="filterStatus">
          <option value="">All Statuses</option>
          <option>Open</option><option>In Progress</option><option>Snoozed</option><option>Closed</option>
        </select>
        <button id="refreshExigenciesBtn">Refresh</button>
      </div>
      <table class="data-table" id="exigenciesTable">
        <thead>
          <tr>
            <th>ID</th><th>School</th><th>Issue</th><th>Owner</th><th>Follow-up</th>
            <th>Status</th><th>Next Due</th><th>Closed</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="tab-schools" class="tab-panel">
      <h2>Schools</h2>
      <form id="addSchoolForm" class="inline-form">
        <input id="newSchoolCode" placeholder="Code (e.g. FSK)" required />
        <input id="newSchoolName" placeholder="Full name (e.g. Fountainhead School Kukatpally)" required />
        <button type="submit">Add School</button>
      </form>
      <div id="schoolsList"></div>
    </section>

    <section id="tab-settings" class="tab-panel">
      <h2>Settings</h2>
      <form id="settingsForm" class="settings-form"></form>
      <button id="saveSettingsBtn" class="btn-primary">Save Settings</button>
      <span id="settingsSaved"></span>
    </section>

    <section id="tab-logs" class="tab-panel">
      <h2>Logs</h2>
      <table class="data-table" id="logsTable">
        <thead><tr><th>Time</th><th>Record</th><th>Recipient</th><th>Type</th><th>Status</th><th>Message</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
